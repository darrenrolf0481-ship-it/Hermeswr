# Package manager: npm.
# package-lock.json is the single source of truth for dependency resolution and
# must stay committed — `npm ci` fails without it. The repo previously carried a
# bun.lock as well, but it predated several dependencies (playwright-core,
# @types/react) and would have resolved stale versions, so it was removed.
# To switch to bun instead: run `bun install` to regenerate a bun.lock from
# package.json, commit it, and replace the npm steps below with
# `bun install --frozen-lockfile` and `bun run <script>`.
#
# Runner: pinned to ubuntu-24.04 instead of ubuntu-latest. GitHub moves the
# `-latest` alias onto a new LTS on its own schedule (24.04 -> 26.04 lands on
# 2026-10-19), and the browser job's `playwright install --with-deps` step
# resolves system libraries at run time — the step that has broken on previous
# LTS jumps. Pinning makes that a deliberate upgrade instead of a surprise that
# surfaces on an unrelated push. Remove the version to follow `-latest` again.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads .nvmrc so CI and local runs cannot drift onto different majors.
      # `cache: npm` is explicit because setup-node no longer auto-detects every
      # package manager; the lockfile it hashes is package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  browser:
    name: Browser check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # playwright-core is a library, not a browser: it downloads nothing, and
      # the harness looks the binary up instead (PLAYWRIGHT_CHROMIUM_PATH, then
      # playwright-core's own default, then the newest chromium-* build in
      # ~/.cache/ms-playwright). Installing chromium is therefore all that is
      # needed, and that last fallback keeps this working if a future
      # `npx playwright` fetches a revision playwright-core does not expect.
      #
      # `playwright` is deliberately not a devDependency — npx fetches the CLI on
      # demand, which it does without a prompt when stdin is not a terminal.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Recon panel browser check
        run: npm run test:browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-artifacts
          path: test/browser/artifacts/
          if-no-files-found: ignore
